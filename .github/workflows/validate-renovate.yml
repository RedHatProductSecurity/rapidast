name: "Validate renovate.json config"

on:
  push:
    branches: ["development", "main"]
    paths:
      - "renovate.json"
  pull_request:
    branches: ["development", "main"]
    paths:
      - "renovate.json"

jobs:
  renovate-config-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: konflux-ci/renovate-config-validator-action@078d8d5e483879bcb260de0f717be30b59df010c  # main
