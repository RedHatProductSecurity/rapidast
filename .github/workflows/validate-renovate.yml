name: "Validate renovate.json config"

on:
  push:
    branches: ["development", "main"]
    paths:
      - "renovate.json"
  pull_request:
    branches: ["development", "main"]
    paths:
      - "renovate.json"

jobs:
  renovate-config-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: konflux-ci/renovate-config-validator-action@078d8d5e483879bcb260de0f717be30b59df010c  # main
