name: "Validate renovate.json config"

on:
  push:
    branches: ["development", "main"]
    paths:
      - "renovate.json"
  pull_request:
    branches: ["development", "main"]
    paths:
      - "renovate.json"

jobs:
  renovate-config-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: konflux-ci/renovate-config-validator-action@1891cfbf5e12443366e799383d6b8141310883b8  # main
